<style>
:root{--bg:#eef2f8;--cd:#fff;--ln:#d9e0ec;--ink:#1c2029;--mu:#5d6676;--rd:#d9232b;--bar:#212e4b}
:root[data-theme="dark"]{--bg:#0f1623;--cd:#212b45;--ln:rgba(255,255,255,.16);--ink:#eceef2;--mu:#a0a8b8;--rd:#ff5a61;--bar:#161e2f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Inter",system-ui,sans-serif;line-height:1.7}
html[lang="en"] .bn,html[lang="bn"] .en{display:none}
html[lang="en"] body{font-family:"Inter","Noto Sans Bengali",system-ui,sans-serif}
header{background:var(--bar);color:#f2f3f6;box-shadow:0 6px 20px rgba(8,12,24,.22)}
.bar{max-width:980px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-family:"Anek Bangla","Noto Sans Bengali",sans-serif;font-weight:600}
.brand img{width:34px;height:auto;display:block}
.tools{display:flex;gap:8px;align-items:center}
.tb,.lg button{font:inherit;font-size:.82rem;color:#f2f3f6;background:transparent;border:1px solid rgba(255,255,255,.3);cursor:pointer}
.tb{width:34px;height:32px;border-radius:7px;display:grid;place-items:center;padding:0}
.tb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb .sun{display:none}
:root[data-theme="dark"] .tb .sun{display:block}
:root[data-theme="dark"] .tb .moon{display:none}
.lg{display:flex}
.lg button{padding:4px 12px;border-radius:0;line-height:1.6}
.lg button:first-child{border-radius:7px 0 0 7px}
.lg button:last-child{border-radius:0 7px 7px 0;border-left:0}
.lg button[aria-pressed="true"]{background:var(--rd);border-color:var(--rd);color:#fff}
main{flex:1;display:grid;place-items:center;padding:36px 18px}
.card{width:100%;max-width:440px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:34px 22px 30px;text-align:center;box-shadow:0 10px 30px rgba(20,30,60,.08)}
.n{font-family:"Anek Bangla","Inter",sans-serif;font-size:4.2rem;font-weight:600;line-height:1.15;letter-spacing:.02em}
.n em{font-style:normal;color:var(--rd)}
.rule{width:46px;height:3px;border-radius:2px;background:var(--rd);margin:10px auto 16px}
h1{margin:0 0 6px;font-size:1.2rem;font-weight:600;font-family:"Anek Bangla","Noto Sans Bengali",sans-serif}
p{margin:0 0 22px;color:var(--mu);font-size:.95rem}
.go{display:inline-block;background:var(--rd);color:#fff;text-decoration:none;border-radius:7px;padding:9px 24px;font-size:.92rem;transition:filter .2s}
.go:hover,.go:focus-visible{filter:brightness(.9);outline:none}
footer{padding:16px;text-align:center;font-size:.8rem;color:var(--mu)}
</style>
